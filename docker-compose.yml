# Self-hosted easy-cookie: Postgres + consent server.
#   cp apps/server/.env.example .env   # then edit ADMIN_*, PUBLIC_URL, POSTGRES_PASSWORD
#   docker compose up -d --build
# The server listens on :8787. Put it behind a TLS reverse proxy and set TRUST_PROXY=true.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: easycookie
      POSTGRES_USER: easycookie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easycookie -d easycookie']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://easycookie:${POSTGRES_PASSWORD:-change-me}@db:5432/easycookie
      PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${SERVER_PORT:-8787}:8787'

volumes:
  pgdata:
